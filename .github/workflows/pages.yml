# GitHub Pages 배포 — 정적 사이트를 빌드해서 올린다.
#
# 사이트는 빌드 시점에 파이프라인을 한 번 실행하고 그 결과를 HTML 로 굽는다.
# 배포된 페이지는 서버도 API 키도 필요 없다 (provider=replay, LLM 호출 0회).
#
# 잡을 둘로 나눈 이유: 모바일 검사는 브라우저가 필요해서 느리다(설치 포함 수 분).
# 빌드와 **병렬로** 돌리면 배포까지의 시간이 브라우저 설치에 끌려가지 않으면서도,
# 모바일이 깨지면 여전히 배포가 막힌다(deploy 가 두 잡 모두에 의존).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/portfolio-project-planning-9sip11]
    paths-ignore: ["**/*.md"]
  # PR 에서도 같은 검사를 돌린다. 안 그러면 깨진 코드가 기본 브랜치에 **들어간 뒤에야**
  # 발견된다 — 배포를 막는 것과 병합을 막는 것은 다른 일이다. 배포는 push 일 때만 한다.
  pull_request:
    branches: [claude/portfolio-project-planning-9sip11]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR 마다 따로 묶는다 — 한 그룹으로 두면 PR 검사가 기본 브랜치 배포를 취소해 버린다.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      # 사이트를 굽기 전에 테스트를 통과해야 한다 — 깨진 수치를 배포하지 않는다.
      - name: Test
        run: python -m pytest -q

      - name: Build site
        run: python tools/build_site.py --out site

      # 화면의 JS 룰엔진이 Python 엔진과 갈라지면 배포를 막는다.
      - name: Verify JS port against Python engine
        run: node tools/verify_js_port.mjs site/fixtures.json

      # PR 검사에서는 굽기까지만 확인하고 산출물은 올리지 않는다 (배포하지 않으므로)
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  mobile:
    # 폰에서 깨진 화면을 올리지 않기 위한 검사. build 와 병렬로 돈다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]" playwright

      # 브라우저 바이너리를 캐시한다. --with-deps 는 쓰지 않는다 —
      # ubuntu-latest 에 필요한 라이브러리가 대부분 있고, apt 설치가 10분 넘게 걸린다.
      - name: Cache browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium

      - name: Mobile layout check
        env:
          REGIMPACT_BROWSER_TESTS: "1"
        run: python -m pytest tests/test_site.py -q

  deploy:
    needs: [build, mobile]
    # PR 검사는 배포하지 않는다 — 병합되지 않은 브랜치가 라이브로 나가면 안 된다.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
