# GitHub Pages 배포 — 정적 사이트를 빌드해서 올린다.
#
# 사이트는 빌드 시점에 파이프라인을 한 번 실행하고 그 결과를 HTML 로 굽는다.
# 배포된 페이지는 서버도 API 키도 필요 없다 (provider=replay, LLM 호출 0회).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/portfolio-project-planning-9sip11]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      # 사이트를 굽기 전에 테스트를 통과해야 한다 — 깨진 수치를 배포하지 않는다.
      # 브라우저 검사(모바일 가로 스크롤)는 느려서 로컬 기본 스위트에서 빠져 있다.
      # 배포 직전에는 반드시 돈다 — 폰에서 깨진 화면을 올리지 않기 위해서다.
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test
        env:
          REGIMPACT_BROWSER_TESTS: "1"
        run: python -m pytest -q

      - name: Build site
        run: python tools/build_site.py --out site

      # 화면의 JS 룰엔진이 Python 엔진과 갈라지면 배포를 막는다.
      - name: Verify JS port against Python engine
        run: node tools/verify_js_port.mjs site/fixtures.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
