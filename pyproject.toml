[project]
name = "regimpact"
version = "0.1.0"
description = "RegImpact AI — 규제 변경 영향분석·검증 시스템 (deterministic LTV 룰엔진)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# RegChange Extractor 실제 실행: Gemini·Anthropic 백엔드 모두 SDK 없이 urllib REST로 동작
# → 추가 의존성 0. 키만 있으면 됨(GEMINI_API_KEY 또는 ANTHROPIC_API_KEY).

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
