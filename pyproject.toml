[project]
name = "regimpact"
version = "0.1.0"
description = "RegImpact AI — 규제 변경 영향분석·검증 시스템 (deterministic LTV 룰엔진)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# 기본 실행 경로(cli/gemini/manual/replay)는 표준 라이브러리만 사용 — 설치할 것이 없다.
# 아래는 유료 Anthropic API를 쓰는 선택 경로에만 필요. 상세: docs/06_LLM_PROVIDER.md
llm = ["anthropic>=0.40"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
