[project]
name = "regimpact"
version = "0.1.0"
description = "RegImpact AI — 규제 변경 영향분석·검증 시스템 (deterministic LTV 룰엔진)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
llm = ["anthropic>=0.40"]   # RegChange Extractor 실제 실행용 (오프라인 테스트엔 불필요)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
