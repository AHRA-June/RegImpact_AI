[project]
name = "regimpact"
version = "0.1.0"
description = "RegImpact AI — 규제 변경 영향분석·검증 시스템 (deterministic LTV 룰엔진)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# RegChange Extractor 실제 실행용 (오프라인 테스트엔 불필요).
# Gemini(기본) 백엔드는 SDK 없이 urllib REST로 동작 → 추가 의존성 없음(GEMINI_API_KEY만).
llm = ["anthropic>=0.40"]   # Anthropic 백엔드 선택 시에만 필요

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
